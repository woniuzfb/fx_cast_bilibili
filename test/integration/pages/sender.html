<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>fx_cast integration sender</title>
        <!--
            The real page half: this is the URL a Cast sender loads, and the
            extension is expected to intercept it (its contentInitial script
            rewrites the src to the eureka loader URL, and the background's
            webRequest listener redirects that to the extension's own SDK). No
            shim, no direct call into extension internals.
        -->
        <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js"></script>
    </head>
    <body>
        <h1>fx_cast integration sender</h1>
        <p id="status">booting</p>
        <script>
            "use strict";

            /**
             * Everything the harness asserts about the PAGE side lands here, so
             * a green result can never be inferred from the native traces alone.
             */
            window.__HARNESS_RESULT__ = {
                sdkLoaded: false,
                initialized: false,
                requestSessionCalled: false,
                requestSessionSucceeded: false,
                selectedDeviceId: undefined,
                sessionId: undefined,
                loadCalled: false,
                loadSucceeded: false,
                errors: []
            };
            const result = window.__HARNESS_RESULT__;
            const status = message => {
                document.getElementById("status").textContent = message;
            };
            const fail = (where, err) => {
                result.errors.push(
                    where +
                        ": " +
                        (err && (err.description || err.message || err.code)
                            ? err.description || err.message || err.code
                            : String(err))
                );
            };

            // The Default Media Receiver id, which is what a plain sender uses.
            const APP_ID = "CC1AD845";

            window.__HARNESS_WAIT_FOR_SDK__ = function (timeoutMs) {
                return new Promise((resolve, reject) => {
                    const deadline = Date.now() + timeoutMs;
                    const tick = () => {
                        if (
                            window.chrome &&
                            window.chrome.cast &&
                            window.chrome.cast.requestSession
                        ) {
                            result.sdkLoaded = true;
                            status("sdk loaded");
                            resolve(true);
                            return;
                        }
                        if (Date.now() > deadline) {
                            reject(new Error("cast SDK never appeared"));
                            return;
                        }
                        setTimeout(tick, 100);
                    };
                    tick();
                });
            };

            window.__HARNESS_INITIALIZE__ = function () {
                return new Promise((resolve, reject) => {
                    try {
                        const sessionRequest = new chrome.cast.SessionRequest(
                            APP_ID
                        );
                        const apiConfig = new chrome.cast.ApiConfig(
                            sessionRequest,
                            () => {},
                            () => {}
                        );
                        chrome.cast.initialize(
                            apiConfig,
                            () => {
                                result.initialized = true;
                                status("initialized");
                                resolve(true);
                            },
                            err => {
                                fail("initialize", err);
                                reject(err);
                            }
                        );
                    } catch (err) {
                        fail("initialize", err);
                        reject(err);
                    }
                });
            };

            /** Requests a session; resolves with the selected receiver. */
            window.__HARNESS_REQUEST_SESSION__ = function () {
                return new Promise((resolve, reject) => {
                    result.requestSessionCalled = true;
                    status("requesting session");
                    try {
                        chrome.cast.requestSession(
                            session => {
                                result.requestSessionSucceeded = true;
                                result.sessionId = session.sessionId;
                                result.selectedDeviceId = session.receiver
                                    ? session.receiver.label
                                    : undefined;
                                status("session: " + session.sessionId);
                                resolve({
                                    sessionId: session.sessionId,
                                    receiverLabel: session.receiver
                                        ? session.receiver.label
                                        : undefined
                                });
                            },
                            err => {
                                fail("requestSession", err);
                                reject(err);
                            },
                            new chrome.cast.SessionRequest(APP_ID)
                        );
                    } catch (err) {
                        fail("requestSession", err);
                        reject(err);
                    }
                });
            };
        </script>
    </body>
</html>
