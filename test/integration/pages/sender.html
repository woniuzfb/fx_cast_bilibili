<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>fx_cast integration sender</title>
    </head>
    <body>
        <h1>fx_cast integration sender</h1>
        <p id="status">booting</p>
        <script>
            "use strict";

            /**
             * The Cast SDK is loaded per ARM, selected by `?arm=`, because the
             * extension only intercepts specific entry URLs and a test that uses
             * an unsupported one fails for a reason that has nothing to do with
             * the interception chain.
             *
             *   A (production): a Chrome sender extension URL. contentInitial.ts
             *      rewrites it to the eureka loader, which the background's
             *      webRequest listener redirects to the extension's own SDK. This
             *      is the full chain and the only arm that must pass.
             *   B (diagnostic): the eureka URL directly. Skips contentInitial, so
             *      it separates "content script did not rewrite" from "background
             *      did not redirect".
             *   C (negative control): the generic /cv/js/sender URL. The
             *      extension does not declare it anywhere, so chrome.cast must
             *      NOT appear; if it does, the harness is measuring something
             *      other than the extension.
             *
             * The script is created dynamically and its `src` assigned as a
             * PROPERTY on purpose: contentInitial patches
             * HTMLScriptElement.prototype.src's setter, and a static src
             * attribute in the markup never goes through that setter.
             */
            const ARMS = {
                A: "chrome-extension://pkedcjkdefgpdelpbcmbmeomcjbeemfm/cast_sender.js",
                B: "https://www.gstatic.com/eureka/clank/cast_sender.js",
                C: "https://www.gstatic.com/cv/js/sender/v1/cast_sender.js"
            };
            const arm = new URLSearchParams(location.search).get("arm") || "A";

            window.__HARNESS_RESULT__ = {
                arm,
                armUrl: ARMS[arm],
                sdkScriptRequested: false,
                sdkScriptLoaded: false,
                sdkLoaded: false,
                initialized: false,
                requestSessionCalled: false,
                // How the SDK settled requestSession, as EVENTS rather than
                // booleans: "did it fail" and "how many times was a callback
                // invoked, and with what" are different questions, and the second
                // one is what a double settlement shows up in.
                requestSessionCalls: 0,
                // The authoritative total is sessionCallbacks.length: a counter
                // that only counted callbacks matching the FIRST type would read 1
                // for an error->success double settlement, which is exactly the
                // case this instrumentation exists to expose.
                sessionCallbacks: [],
                successCount: 0,
                errorCount: 0,
                settleType: undefined,
                requestSessionSucceeded: false,
                selectedReceiverLabel: undefined,
                sessionId: undefined,
                resources: [],
                contentInitialRan: undefined,
                errors: []
            };
            const result = window.__HARNESS_RESULT__;
            const status = message => {
                document.getElementById("status").textContent = message;
            };
            const fail = (where, err) => {
                result.errors.push(
                    where +
                        ": " +
                        (err && (err.description || err.message || err.code)
                            ? err.description || err.message || err.code
                            : String(err))
                );
            };

            const APP_ID = "CC1AD845";

            const script = document.createElement("script");
            script.src = ARMS[arm];
            result.sdkScriptRequested = true;
            // Read back what the property setter actually produced. The
            // extension's contentInitial patches that setter, so this is how the
            // page can tell "the rewrite never ran" from "it ran and the
            // redirect failed".
            result.assignedSrc = ARMS[arm];
            result.effectiveSrc = script.src;
            script.onload = () => {
                result.sdkScriptLoaded = true;
                status("script loaded");
            };
            script.onerror = () => {
                fail("sdk-script", "the script element fired onerror");
                status("script failed");
            };
            document.head.appendChild(script);

            /** Resource timing is diagnostic evidence, never a pass criterion:
             *  a cross-scheme redirect may not be observable here at all. */
            /** Evidence for the contentInitial bisect: did the content script
             *  run at all, separately from whether its src rewrite took effect?
             *  The mark is only ever set by an instrumented test build. */
            window.__HARNESS_CONTENT_INITIAL_MARK__ = function () {
                return {
                    wrappedJSObject:
                        Boolean(window.__FX_CAST_CONTENT_INITIAL_RAN__),
                    head: document.documentElement.getAttribute(
                        "data-fx-harness-ci-head"
                    ),
                    tail: document.documentElement.getAttribute(
                        "data-fx-harness-ci-tail"
                    )
                };
            };

            window.__HARNESS_COLLECT_RESOURCES__ = function () {
                result.resources = performance
                    .getEntriesByType("resource")
                    .map(entry => entry.name)
                    .filter(
                        name =>
                            name.includes("cast_sender") ||
                            name.includes("/cast/content")
                    );
                return result.resources;
            };

            window.__HARNESS_SNAPSHOT__ = function () {
                result.contentInitialRan = window.__HARNESS_CONTENT_INITIAL_MARK__();
                result.effectiveSrc = script.src;
                window.__HARNESS_COLLECT_RESOURCES__();
                return result;
            };

            window.__HARNESS_WAIT_FOR_SDK__ = function (timeoutMs) {
                return new Promise((resolve, reject) => {
                    const deadline = Date.now() + timeoutMs;
                    const tick = () => {
                        if (
                            window.chrome &&
                            window.chrome.cast &&
                            window.chrome.cast.requestSession
                        ) {
                            result.sdkLoaded = true;
                            status("sdk loaded");
                            resolve(true);
                            return;
                        }
                        if (Date.now() > deadline) {
                            window.__HARNESS_COLLECT_RESOURCES__();
                            reject(
                                new Error(
                                    "cast SDK never appeared (arm " +
                                        arm +
                                        ", resources: " +
                                        JSON.stringify(result.resources) +
                                        ")"
                                )
                            );
                            return;
                        }
                        setTimeout(tick, 100);
                    };
                    tick();
                });
            };

            window.__HARNESS_INITIALIZE__ = function () {
                return new Promise((resolve, reject) => {
                    try {
                        const apiConfig = new chrome.cast.ApiConfig(
                            new chrome.cast.SessionRequest(APP_ID),
                            () => {},
                            () => {}
                        );
                        chrome.cast.initialize(
                            apiConfig,
                            () => {
                                result.initialized = true;
                                status("initialized");
                                resolve(true);
                            },
                            err => {
                                fail("initialize", err);
                                reject(err);
                            }
                        );
                    } catch (err) {
                        fail("initialize", err);
                        reject(err);
                    }
                });
            };

            /** The session the selector granted, so LOAD can target it. */
            let currentSession;

            window.__HARNESS_LOAD__ = function (overrides) {
                return new Promise((resolve, reject) => {
                    if (!currentSession) {
                        result.errors.push("load: no session");
                        reject(new Error("no session"));
                        return;
                    }
                    result.loadCalled = true;
                    const media = {
                        // Must be a real http(s) URL: RokuSession.handleLoad()
                        // rejects anything else with LOAD_FAILED before it
                        // launches, registers session media or publishes it.
                        contentId: (overrides && overrides.contentId) ||
                            location.origin + "/harness-stage2.m3u8",
                        contentType: "application/vnd.apple.mpegurl",
                        streamType: "BUFFERED",
                        duration: (overrides && overrides.duration) || 7200,
                        metadata: {
                            title: "Harness DVR",
                            images: []
                        },
                        // The anchors the Roku startup synthesis exists for.
                        customData: {
                            hlsDvr: true,
                            pageDuration: 7200,
                            harnessMarker:
                                (overrides && overrides.harnessMarker) ||
                                "stage2"
                        }
                    };
                    try {
                        const request = new chrome.cast.media.LoadRequest(
                            new chrome.cast.media.MediaInfo(
                                media.contentId,
                                media.contentType
                            )
                        );
                        request.media.duration = media.duration;
                        request.media.customData = media.customData;
                        request.media.metadata = media.metadata;
                        currentSession.loadMedia(
                            request,
                            () => {
                                result.loadSucceeded = true;
                                resolve(true);
                            },
                            err => {
                                result.loadError = String(
                                    (err && (err.description || err.code)) || err
                                );
                                result.errors.push("load: " + result.loadError);
                                reject(err);
                            }
                        );
                    } catch (err) {
                        result.errors.push("load: " + String(err));
                        reject(err);
                    }
                });
            };

            const recordSessionCallback = (type, payload) => {
                result.sessionCallbacks.push({
                    at: Date.now(),
                    type,
                    payload
                });
                if (type === "success") result.successCount++;
                else result.errorCount++;
                if (result.settleType === undefined) {
                    // First settlement TYPE only; the count is the array length.
                    result.settleType = type;
                }
            };

            window.__HARNESS_REQUEST_SESSION__ = function () {
                return new Promise((resolve, reject) => {
                    result.requestSessionCalled = true;
                    result.requestSessionCalls++;
                    status("requesting session");
                    try {
                        chrome.cast.requestSession(
                            session => {
                                currentSession = session;
                                recordSessionCallback("success", {
                                    sessionId: session.sessionId
                                });
                                result.requestSessionSucceeded = true;
                                result.sessionId = session.sessionId;
                                // `receiver.label` is the FRIENDLY NAME, not the
                                // deviceId: naming it selectedDeviceId invited
                                // reading a friendly-name mismatch as a failed
                                // selection. The authoritative device id comes
                                // from the native trace.
                                result.selectedReceiverLabel = session.receiver
                                    ? session.receiver.label
                                    : undefined;
                                status("session: " + session.sessionId);
                                resolve({
                                    sessionId: session.sessionId,
                                    receiverLabel: session.receiver
                                        ? session.receiver.label
                                        : undefined
                                });
                            },
                            err => {
                                recordSessionCallback("error", {
                                    code: err && err.code,
                                    description: err && err.description,
                                    message: err && err.message
                                });
                                fail("requestSession", err);
                                reject(err);
                            },
                            new chrome.cast.SessionRequest(APP_ID)
                        );
                    } catch (err) {
                        fail("requestSession", err);
                        reject(err);
                    }
                });
            };
        </script>
    </body>
</html>
