name: Build bridge & extension (Windows, macOS & Linux)

on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: >-
                    Tag of an existing release to republish with the signed
                    xpi. Leave empty to only build and upload artifacts.
                type: string

jobs:
    build:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [macos-latest, macos-15-intel, ubuntu-latest, windows-2022]
                node-version: [22.x]

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            # Old version of node-gyp needs Python with setuptools (easier to just use old Python)
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            - name: Install Ubuntu dependencies
              if: ${{ matrix.os == 'ubuntu-latest' }}
              run: sudo apt install -y libavahi-compat-libdnssd-dev dpkg rpm

            - run: npm ci --prefix ./bridge

            - name: Package (Windows)
              if: ${{ matrix.os == 'windows-2022' }}
              run: npm run package:bridge -- -- --arch=x64
            - uses: actions/upload-artifact@v4
              if: ${{ matrix.os == 'windows-2022' }}
              with:
                  name: fx_cast_bilibili_bridge-win64
                  path: dist/bridge/*

            - name: Package (macOS)
              if: ${{ matrix.os == 'macos-latest' }}
              run: npm run package:bridge -- -- --arch=arm64
            - uses: actions/upload-artifact@v4
              if: ${{ matrix.os == 'macos-latest' }}
              with:
                  name: fx_cast_bilibili_bridge-macos
                  path: dist/bridge/*

            - name: Package (macOS Intel)
              if: ${{ matrix.os == 'macos-15-intel' }}
              run: npm run package:bridge -- -- --arch=x64
            - uses: actions/upload-artifact@v4
              if: ${{ matrix.os == 'macos-15-intel' }}
              with:
                  name: fx_cast_bilibili_bridge-macos-intel
                  path: dist/bridge/*

            - name: Package (Ubuntu, deb)
              if: ${{ matrix.os == 'ubuntu-latest' }}
              run: npm run package:bridge -- -- --package-type=deb
            - uses: actions/upload-artifact@v4
              if: ${{ matrix.os == 'ubuntu-latest' }}
              with:
                  name: fx_cast_bilibili_bridge-linux-deb
                  path: dist/bridge/*

            - name: Package (Ubuntu, rpm)
              if: ${{ matrix.os == 'ubuntu-latest' }}
              run: npm run package:bridge -- -- --package-type=rpm
            - uses: actions/upload-artifact@v4
              if: ${{ matrix.os == 'ubuntu-latest' }}
              with:
                  name: fx_cast_bilibili_bridge-linux-rpm
                  path: dist/bridge/*

    build-extension:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - run: npm ci --prefix ./extension
            - run: npm run package:extension

            - uses: actions/upload-artifact@v4
              with:
                  name: bilibili_cast-extension
                  path: dist/extension/*.xpi

            - name: Sign extension (AMO)
              env:
                  WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
                  WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
              run: |
                  if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
                    echo "::error::Set the AMO_API_KEY / AMO_API_SECRET repository secrets (create a key at https://addons.mozilla.org/developers/addon/api/key/)"
                    exit 1
                  fi
                  npm run sign:extension

            - uses: actions/upload-artifact@v4
              with:
                  name: bilibili_cast-extension-signed
                  path: dist/extension/signed/*.xpi

            - name: Publish signed xpi to release
              if: ${{ inputs.release_tag != '' }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              run: |
                  if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY"; then
                    echo "::error::Release $RELEASE_TAG does not exist (create it first, or run without release_tag)."
                    exit 1
                  fi

                  gh release upload "$RELEASE_TAG" dist/extension/signed/*.xpi \
                      --clobber -R "$GITHUB_REPOSITORY"

                  # Signed-only distribution: drop any xpi assets that were
                  # not just uploaded (e.g. a previously unsigned build).
                  comm -23 \
                      <(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
                          --json assets --jq '.assets[].name' \
                          | grep '\.xpi$' | sort) \
                      <(basename -a dist/extension/signed/*.xpi | sort) \
                      | while read -r asset; do
                          echo "Removing superseded asset: $asset"
                          gh release delete-asset "$RELEASE_TAG" "$asset" \
                              --yes -R "$GITHUB_REPOSITORY"
                      done
