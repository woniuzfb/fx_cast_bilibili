name: Build bridge & extension (Windows, macOS & Linux)

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    # Single owner for release creation: concurrent "gh release create"
    # calls race and end up with duplicate draft releases.
    prepare-release:
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # Idempotent: falls back to view when the release already
              # exists (e.g. re-pushed tag after a failed attempt).
              run: |
                  gh release create "${{ github.ref_name }}" --draft \
                      --generate-notes -R "$GITHUB_REPOSITORY" \
                      || gh release view "${{ github.ref_name }}" -R "$GITHUB_REPOSITORY"

    build:
        needs: prepare-release
        if: ${{ !failure() && !cancelled() }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write

        strategy:
            matrix:
                os: [macos-latest, macos-15-intel, ubuntu-latest, windows-2022]
                node-version: [22.x]

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            # Old version of node-gyp needs Python with setuptools (easier to just use old Python)
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            - name: Install Ubuntu dependencies
              if: ${{ matrix.os == 'ubuntu-latest' }}
              run: sudo apt install -y libavahi-compat-libdnssd-dev dpkg rpm

            - run: npm ci --prefix ./bridge

            - name: Package (Windows)
              if: ${{ matrix.os == 'windows-2022' }}
              run: npm run package:bridge -- -- --arch=x64
            - uses: actions/upload-artifact@v4
              if: ${{ matrix.os == 'windows-2022' }}
              with:
                  name: fx_cast_bilibili_bridge-win64
                  path: dist/bridge/*
            - name: Publish to release (Windows)
              if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-2022' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: gh release upload "$RELEASE_TAG" dist/bridge/* --clobber -R "$GITHUB_REPOSITORY"

            - name: Package (macOS)
              if: ${{ matrix.os == 'macos-latest' }}
              run: npm run package:bridge -- -- --arch=arm64
            - uses: actions/upload-artifact@v4
              if: ${{ matrix.os == 'macos-latest' }}
              with:
                  name: fx_cast_bilibili_bridge-macos
                  path: dist/bridge/*
            - name: Publish to release (macOS)
              if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'macos-latest' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: gh release upload "$RELEASE_TAG" dist/bridge/* --clobber -R "$GITHUB_REPOSITORY"

            - name: Package (macOS Intel)
              if: ${{ matrix.os == 'macos-15-intel' }}
              run: npm run package:bridge -- -- --arch=x64
            - uses: actions/upload-artifact@v4
              if: ${{ matrix.os == 'macos-15-intel' }}
              with:
                  name: fx_cast_bilibili_bridge-macos-intel
                  path: dist/bridge/*
            - name: Publish to release (macOS Intel)
              if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'macos-15-intel' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: gh release upload "$RELEASE_TAG" dist/bridge/* --clobber -R "$GITHUB_REPOSITORY"

            - name: Package (Ubuntu, deb)
              if: ${{ matrix.os == 'ubuntu-latest' }}
              run: npm run package:bridge -- -- --package-type=deb
            - uses: actions/upload-artifact@v4
              if: ${{ matrix.os == 'ubuntu-latest' }}
              with:
                  name: fx_cast_bilibili_bridge-linux-deb
                  path: dist/bridge/*
            # Bridge packaging wipes dist/bridge between runs, so the deb
            # must be published before the rpm build starts.
            - name: Publish to release (deb)
              if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: gh release upload "$RELEASE_TAG" dist/bridge/* --clobber -R "$GITHUB_REPOSITORY"

            - name: Package (Ubuntu, rpm)
              if: ${{ matrix.os == 'ubuntu-latest' }}
              run: npm run package:bridge -- -- --package-type=rpm
            - uses: actions/upload-artifact@v4
              if: ${{ matrix.os == 'ubuntu-latest' }}
              with:
                  name: fx_cast_bilibili_bridge-linux-rpm
                  path: dist/bridge/*
            - name: Publish to release (rpm)
              if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: gh release upload "$RELEASE_TAG" dist/bridge/* --clobber -R "$GITHUB_REPOSITORY"

    build-extension:
        needs: prepare-release
        if: ${{ !failure() && !cancelled() }}
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - run: npm ci --prefix ./extension
            - run: npm run package:extension

            - uses: actions/upload-artifact@v4
              with:
                  name: bilibili_cast-extension
                  path: dist/extension/*.xpi

            # AMO refuses to sign the same version twice, so a mismatched tag
            # must be rejected before signing consumes the version.
            - name: Verify tag matches manifest version
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  VERSION=$(node -p "require('./extension/src/manifest.json').version")
                  if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
                    echo "::error::Tag $GITHUB_REF_NAME does not match extension version v$VERSION"
                    exit 1
                  fi

            - name: Sign extension (AMO)
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
                  WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
              run: |
                  if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
                    echo "::error::Set the AMO_API_KEY / AMO_API_SECRET repository secrets (create a key at https://addons.mozilla.org/developers/addon/api/key/)"
                    exit 1
                  fi
                  npm run sign:extension

            # Signing consumes the AMO version, so it only runs for tag
            # pushes (manual dispatch is a build-only test path).
            - uses: actions/upload-artifact@v4
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  name: bilibili_cast-extension-signed
                  path: dist/extension/signed/*.xpi

            - name: Publish signed xpi to release
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  # AMO names signed files after the add-on's internal ID;
                  # publish under the project name instead.
                  VERSION=$(node -p "require('./extension/src/manifest.json').version")
                  RELEASE_XPI="fx_cast_bilibili-${VERSION}.xpi"
                  cp dist/extension/signed/*.xpi "$RELEASE_XPI"

                  gh release upload "$RELEASE_TAG" "$RELEASE_XPI" \
                      --clobber -R "$GITHUB_REPOSITORY"

                  # Signed-only distribution: drop any xpi assets that were
                  # not just uploaded (e.g. a previously unsigned build, or
                  # an AMO-named signed one).
                  comm -23 \
                      <(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
                          --json assets --jq '.assets[].name' \
                          | grep '\.xpi$' | sort) \
                      <(echo "$RELEASE_XPI" | sort) \
                      | while read -r asset; do
                          echo "Removing superseded asset: $asset"
                          gh release delete-asset "$RELEASE_TAG" "$asset" \
                              --yes -R "$GITHUB_REPOSITORY"
                      done

    publish:
        needs: [build, build-extension]
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            # Assets are uploaded to a draft while builds run; publish it
            # once everything has succeeded.
            - env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "${{ github.ref_name }}" --draft=false -R "$GITHUB_REPOSITORY"
